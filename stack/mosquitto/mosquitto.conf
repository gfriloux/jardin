# Mosquitto 2.x n'écoute par défaut que sur la boucle locale et refuse les
# connexions anonymes. Sans ce fichier, le broker démarre, ne journalise rien
# d'anormal, et aucun client ne peut s'y connecter — un grand classique.

listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# Les messages de découverte Home Assistant sont retenus (retain) : ils doivent
# survivre à un redémarrage du broker, sinon les entités disparaissent.
autosave_interval 60
