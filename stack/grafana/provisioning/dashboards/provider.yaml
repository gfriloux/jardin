apiVersion: 1

providers:
  - name: jardin
    type: file
    # Le fichier fait foi. Les modifications faites dans l'interface ne sont
    # pas enregistrables : pour expérimenter, « Save as » crée une copie, et
    # ce qui mérite d'être gardé est reporté dans le JSON versionné.
    allowUiUpdates: false
    disableDeletion: true
    updateIntervalSeconds: 30
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
