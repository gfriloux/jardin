apiVersion: 1

datasources:
  - name: Jardin
    type: mysql
    uid: jardin
    access: proxy
    url: mariadb:3306
    database: jardin
    user: jardin
    isDefault: true
    editable: false
    secureJsonData:
      password: $JARDIN_DB_PASSWORD
    jsonData:
      timezone: Europe/Paris
      # Les tables sont minuscules à l'échelle d'un jardin : quelques
      # millions de lignes par an au maximum.
      maxOpenConns: 10
      maxIdleConns: 5
