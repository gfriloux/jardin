; Firmware des nœuds — ESP32-S3 + SX1262 (Heltec WiFi LoRa 32 V3 / clone Heemol).
;
; Un environnement par croquis : ils se font dans l'ordre, chacun validant une
; chose et une seule. `build_src_filter` sélectionne le répertoire à compiler,
; sinon PlatformIO compilerait tous les main() à la fois.
;
;   just fw 01-blink     compile, téléverse et ouvre le moniteur série
;   just fw-check        compile tout, sans carte branchée

[env]
; Épinglé. PlatformIO n'a pas de fichier de verrouillage : ce fichier est le
; verrou. Sans version explicite, la plateforme saute silencieusement à la
; suivante dès qu'Espressif publie — emportant avec elle le cœur Arduino et
; toute la chaîne de compilation.
;
; Sur une carte qui est déjà un clone au brochage incertain, un croquis qui
; cesse de fonctionner après une montée de version invisible enverrait
; soupçonner le matériel. Relever la version est un acte volontaire, et son
; effet se vérifie avec `just fw-check`.
platform = espressif32@7.0.1
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_flags = -DCORE_DEBUG_LEVEL=0

; 01 — La chaîne complète : compilation, téléversement, moniteur série.
[env:01-blink]
build_src_filter = -<*> +<01-blink/>

; 02 — L'écran, qui valide le brochage I2C et Vext.
[env:02-oled]
build_src_filter = -<*> +<02-oled/>
lib_deps = olikraus/U8g2@2.36.18

; 03 — La radio, qui valide le bus SPI vers le SX1262. N'émet pas.
[env:03-radio]
build_src_filter = -<*> +<03-radio/>
lib_deps = jgromes/RadioLib@7.7.1

; 04 — Première lecture de la sonde.
[env:04-sonde]
build_src_filter = -<*> +<04-sonde/>

; 04b — Diagnostic, hors progression : la sonde est-elle reliée à l'ADC ?
; À sortir quand 04-sonde renvoie du bruit proche de zéro.
[env:04b-sonde-diag]
build_src_filter = -<*> +<04b-sonde-diag/>

; 05 — Caractérisation : moyenne, écart-type, étendue.
[env:05-caracterisation]
build_src_filter = -<*> +<05-caracterisation/>

; 06 — Alimentation de la sonde à la demande, et temps de stabilisation.
[env:06-alim-a-la-demande]
build_src_filter = -<*> +<06-alim-a-la-demande/>

; 07 — Trois sondes en direct, sans multiplexeur : le montage de O3.
[env:07-trois-sondes]
build_src_filter = -<*> +<07-trois-sondes/>
